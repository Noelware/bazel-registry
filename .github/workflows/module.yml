name: CI / Modules
on:
    pull_request:
        types:
            - opened
            - synchronize
            - ready_for_review
        paths:
            - 'modules/**'
jobs:
    validate-module:
        name: "Validate"
        runs-on: ubuntu-latest
        outputs:
            modules: ${{steps.modified.outputs.modules}}
            has_changes: ${{steps.modified.outputs.has_changes}}
        steps:
            - uses: actions/checkout@v7
              with:
                submodules: recursive
                fetch-depth: 0

            - run: .ci/validate-modified.sh
              id: modified
    check:
        name: "Check ${{matrix.module.name}}@${{matrix.module.version}} [${{matrix.runner}} / Bazel v${{matrix.bazel}}]"
        runs-on: ${{matrix.runner}}
        needs: [validate-module]
        if: needs.validate-module.outputs.has_changes == 'true'
        strategy:
            fail-fast: true
            matrix:
                bazel: ["7.x", "8.x", "9.x"]
                runner: [ubuntu-latest, macos-latest, windows-latest]
                module: ${{fromJson(needs.validate-module.outputs.modules)}}
        env:
            USE_BAZEL_VERSION: ${{matrix.bazel}}
        steps:
            - name: Enable Symlinks and use Unix line endings (Windows)
              if: runner.os == 'Windows'
              run: |
                git config --global core.symlinks true
                git config --global core.autocrlf false

            - uses: actions/checkout@v7
              with:
                submodules: recursive

            - run: ".ci/check-module.${{runner.os == 'Windows' && 'ps1' || 'sh'}} ${{matrix.module.name}} ${{matrix.module.version}}"
